spring.application.name=order-service
spring.profiles.active=dev
spring.config.import=optional:configserver:http://config-service:8888
# ─── Kafka Details ──────────────────────────────────────────────────────────────────────────────────

# Kafka bootstrap servers (point this to your Kafka broker)
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}

# Producer key serializer (string format)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Producer value serializer (JSON format to serialize your event objects)
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Producer Configuration
spring.kafka.producer.transaction-id-prefix=order-service-tx-
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retries=3
spring.kafka.producer.properties.acks=all
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1

# Consumer Configuration
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# (Optional) Additional config to trust your event package when deserializing JSON on consumer side
spring.kafka.consumer.properties.spring.json.trusted.packages=com.table2table.security.events
spring.kafka.consumer.properties.enable.auto.commit=false
spring.kafka.consumer.auto-offset-reset=earliest

# Topic configurations - Note: these can't create topics from application.properties,
# you'd use KafkaAdmin/NewTopic beans instead
spring.kafka.topics.food-request-events.partitions=3
spring.kafka.topics.food-request-events.replication-factor=1
spring.kafka.topics.order-status-events.partitions=3
spring.kafka.topics.order-status-events.replication-factor=1
spring.kafka.topics.payment-events.partitions=3
spring.kafka.topics.payment-events.replication-factor=1
spring.kafka.topics.food-request-events-dlq.partitions=1
spring.kafka.topics.food-request-events-dlq.replication-factor=1

# Spring Actuator for monitoring
management.endpoints.web.exposure.include=health,info,metrics,kafka
management.endpoint.health.show-details=always

